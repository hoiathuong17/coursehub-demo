      \    pm.response.to.have.status(201);\r

      });\r

      pm.test(\"Dang ky thanh cong\", () => {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.message).to.eql(\"Dang ky thanh cong\");\r

      \    pm.expect(data.student_id).to.eql(\"22000004\");\r

      \    pm.expect(data.class_section_id).to.eql(\"WEB-01\");\r

      });"
    language: text/javascript
order: 7000
