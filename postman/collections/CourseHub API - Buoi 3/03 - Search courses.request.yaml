$kind: http-request
url: "{{base_url}}/courses?q=web"
method: GET
queryParams:
  q: web
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code la 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      pm.test(\"Tim thay hoc phan Web INT2204\", () => {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.some(c => c.code === \"INT2204\")).to.be.true;\r

      });"
    language: text/javascript
order: 3000
